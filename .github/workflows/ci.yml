name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}

      - name: TRON integration demo
        if: env.TRONGRID_API_KEY != ''
        run: npx tsx scripts/test-tron-real.ts
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}

      - name: TRON multi-source comparison
        if: env.TRONGRID_API_KEY != '' && env.TRONSCAN_API_KEY != ''
        run: npx tsx scripts/compare-sources.ts
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}

      - name: TRON full audit
        if: env.TRONGRID_API_KEY != ''
        run: npx tsx scripts/tron-audit.ts
        timeout-minutes: 5
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}

      - name: Build
        run: pnpm build

